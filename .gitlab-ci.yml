# Mirrors .github/workflows/ci-build.yml.
#
# Runs on GitLab-hosted Windows runners (beta). They have no Docker executor, so
# there is no `image:` and every script line is PowerShell. Windows runners bill at a
# higher rate than Linux against the namespace's compute minutes.
#
# To use your own runner instead, swap the tag below for whatever you registered.

stages:
  - build

build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # GitLab's Windows image ships CMake 3.27.8; safetyhook needs >= 3.28.
    #
    # xmake's find_cmake seeds its search with the registry install dir
    # (HKLM\SOFTWARE\Kitware\CMake;InstallDir) and returns the first hit, and its
    # system-PATH branch is commented out, so prepending to PATH does nothing. Point
    # the registry key at the CMake we unpack, and keep the PATH entry for the
    # last-resort bare-name lookup.
    - $cmakeVer = "3.31.7"
    - Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" -OutFile cmake.zip -UseBasicParsing
    - Expand-Archive cmake.zip -DestinationPath "$env:CI_PROJECT_DIR\.cmake" -Force
    - $cmakeDir = "$env:CI_PROJECT_DIR\.cmake\cmake-$cmakeVer-windows-x86_64"
    - $env:PATH = "$cmakeDir\bin;$env:PATH"
    - Write-Host "running as $(whoami)"
    - New-Item -Path 'HKLM:\SOFTWARE\Kitware\CMake' -Force | Out-Null
    - Set-ItemProperty -Path 'HKLM:\SOFTWARE\Kitware\CMake' -Name 'InstallDir' -Value $cmakeDir
    - Write-Host "registry InstallDir -> $((Get-ItemProperty 'HKLM:\SOFTWARE\Kitware\CMake').InstallDir)"
    - cmake --version
    # The install script appends its install dir to $env:Path for this session.
    - irm https://xmake.io/psget.text | iex
    - xmake --version
  script:
    # -m ci builds with warnings as errors.
    - xmake repo --update
    - xmake config -m ci --yes
    - xmake build
